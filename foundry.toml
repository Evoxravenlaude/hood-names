[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 1200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./reserved" }, { access = "read", path = "./nametables" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"

[lint]
lint_on_build = false
